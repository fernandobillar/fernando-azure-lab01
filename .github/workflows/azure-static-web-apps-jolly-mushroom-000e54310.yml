            { id: 92, q: "¿Qué componente de seguridad filtra el tráfico de red hacia y desde los recursos de Azure en una red virtual basándose en direcciones IP, puertos y protocolos?", opts: ["A. Grupos de seguridad de red (Network Security Groups - NSGs)", "B. Azure Firewall", "C. Azure Front Door", "D. Azure Bastion"], ans: "A", multi: false },
            { id: 93, q: "¿Qué servicio de seguridad de firewall gestionado y basado en la nube protege los recursos de red virtual de Azure con alta disponibilidad integrada?", opts: ["A. Azure Firewall", "B. Network Security Groups (NSG)", "C. Azure Application Gateway", "D. Azure DDoS Protection"], ans: "A", multi: false },
            { id: 94, q: "¿Qué nivel de protección DDoS de Azure está habilitado de forma predeterminada y sin costo adicional en la plataforma para proteger toda la infraestructura de Azure?", opts: ["A. Azure DDoS Network Protection", "B. Azure DDoS Standard", "C. Azure DDoS Basic Protection", "D. Azure Firewall DDoS"], ans: "C", multi: false },
            { id: 95, q: "¿Qué servicio de cumplimiento normativo y gobernanza en el portal de Azure proporciona acceso a auditorías independientes y certificaciones de cumplimiento de la industria?", opts: ["A. Centro de Confianza de Microsoft (Microsoft Trust Center)", "B. Azure Advisor", "C. Azure Policy", "D. Azure Blueprints"], ans: "A", multi: false },
            { id: 96, q: "¿Qué característica de Microsoft Entra ID permite a los usuarios verificar su identidad mediante múltiples métodos de autenticación (como SMS, app autenticadora o biometría)?", opts: ["A. Autenticación multifactor (MFA)", "B. Acceso Condicional (Conditional Access)", "C. Identidades administradas (Managed Identities)", "D. Single Sign-On (SSO)"], ans: "A", multi: false },
            { id: 97, q: "¿Qué característica de Microsoft Entra ID permite aplicar decisiones de control de acceso automatizadas basadas en condiciones como ubicación, dispositivo, usuario y riesgo?", opts: ["A. Acceso Condicional (Conditional Access)", "B. Autenticación multifactor (MFA)", "C. Azure RBAC", "D. Privileged Identity Management (PIM)"], ans: "A", multi: false },
            { id: 98, q: "¿Qué servicio de Microsoft Entra ID ayuda a las organizaciones a administrar, controlar y supervisar el acceso privilegiado dentro de Azure mediante activaciones just-in-time?", opts: ["A. Microsoft Entra Privileged Identity Management (PIM)", "B. Azure RBAC", "C. Azure Conditional Access", "D. Azure Key Vault"], ans: "A", multi: false },
            { id: 99, q: "¿Cuál es el beneficio de utilizar Identidades Administradas (Managed Identities) para recursos de Azure?", opts: ["A. Elimina la necesidad de que los desarrolladores administren credenciales y secretos en el código fuente", "B. Permite conectar redes locales mediante VPN", "C. Reduce automáticamente el costo de las máquinas virtuales", "D. Duplica el SLA de los servicios de almacenamiento"], ans: "A", multi: false },
            { id: 100, q: "¿Qué servicio de Azure ofrece un repositorio privado de contenedores Docker totalmente administrado para almacenar y gestionar imágenes de contenedores?", opts: ["A. Azure Container Registry (ACR)", "B. Azure Container Instances (ACI)", "C. Azure Kubernetes Service (AKS)", "D. Azure App Service"], ans: "A", multi: false },
            { id: 101, q: "¿Qué servicio sin servidor permite ejecutar contenedores en Azure de forma rápida y sencilla sin necesidad de aprovisionar máquinas virtuales ni orquestadores complejos?", opts: ["A. Azure Container Instances (ACI)", "B. Azure Container Registry", "C. Azure Kubernetes Service (AKS)", "D. Azure Functions"], ans: "A", multi: false },
            { id: 102, q: "¿Qué servicio de Azure proporciona orquestación completa de contenedores con Kubernetes totalmente administrado por Microsoft?", opts: ["A. Azure Kubernetes Service (AKS)", "B. Azure Container Instances", "C. Azure Service Fabric", "D. Azure App Service"], ans: "A", multi: false }
        ];

        let activeQuiz = [];
        let currentIndex = 0;
        let userAnswers = {};

        function startQuiz() {
            let shuffled = [...masterPool].sort(() => 0.5 - Math.random());
            activeQuiz = shuffled.slice(0, 50);
            currentIndex = 0;
            userAnswers = {};
            renderQuestion();
        }

        function renderQuestion() {
            const container = document.getElementById('appContainer');
            const item = activeQuiz[currentIndex];
            const total = activeQuiz.length;
            const progressPct = ((currentIndex + 1) / total) * 100;

            let html = `
                <div class="progress-info">
                    <span>Pregunta ${currentIndex + 1} de ${total}</span>
                    <span class="badge">${item.multi ? 'Selección Múltiple' : 'Selección Única'}</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: ${progressPct}%"></div>
                </div>
                <div class="question-title">${item.q}</div>
            `;

            if (item.image && item.image.trim() !== "") {
                html += `
                    <div class="question-image">
                        <img src="${item.image}" alt="Diagrama de soporte para la pregunta">
                    </div>
                `;
            }

            html += `<div class="options-list">`;
            
            const inputType = item.multi ? 'checkbox' : 'radio';
            const savedAns = userAnswers[currentIndex] || [];

            item.opts.forEach(opt => {
                const letter = opt.charAt(0);
                const isChecked = savedAns.includes(letter) ? 'checked' : '';
                html += `
                    <label class="option-item">
                        <input type="${inputType}" name="qOpt" value="${letter}" ${isChecked} onchange="saveAnswer(${currentIndex}, '${letter}', ${item.multi})">
                        <span class="option-text">${opt}</span>
                    </label>
                `;
            });

            html += `</div>
                <div class="nav-buttons">
                    <button class="btn btn-secondary" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled' : ''}>← Anterior</button>
                    ${currentIndex === total - 1 ? 
                        `<button class="btn" onclick="finishQuiz()">Terminar Examen</button>` : 
                        `<button class="btn" onclick="nextQuestion()">Siguiente →</button>`
                    }
                </div>
            `;

            container.innerHTML = html;
        }

        function saveAnswer(qIdx, letter, isMulti) {
            if (isMulti) {
                if (!userAnswers[qIdx]) userAnswers[qIdx] = [];
                const idx = userAnswers[qIdx].indexOf(letter);
                if (idx > -1) {
                    userAnswers[qIdx].splice(idx, 1);
                } else {
                    userAnswers[qIdx].push(letter);
                }
                userAnswers[qIdx].sort();
            } else {
                userAnswers[qIdx] = [letter];
            }
        }

        function nextQuestion() {
            if (currentIndex < activeQuiz.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function finishQuiz() {
            let score = 0;
            let reviewHtml = '';

            activeQuiz.forEach((item, idx) => {
                const userSelArr = (userAnswers[idx] || []).sort();
                const userSel = userSelArr.join('');
                const correctAnsArr = item.ans.split('').sort();
                const correctAns = correctAnsArr.join('');
                const isCorrect = userSel === correctAns;

                if (isCorrect) score++;

                // Helper to get full option texts
                const getOptionTexts = (letters) => {
                    if (!letters || letters.length === 0) return '<em>Sin responder</em>';
                    return letters.map(l => {
                        const opt = item.opts.find(o => o.startsWith(l + '.'));
                        return opt ? `<strong>${opt}</strong>` : `<strong>${l}</strong>`;
                    }).join('<br/>');
                };

                const userText = getOptionTexts(userSelArr);
                const correctText = getOptionTexts(correctAnsArr);

                reviewHtml += `
                    <div class="review-card ${isCorrect ? 'correct' : 'incorrect'}">
                        <div style="font-weight: 600; margin-bottom: 8px;">Pregunta ${idx + 1}: ${item.q}</div>
                        <div style="color: ${isCorrect ? 'var(--success-color)' : 'var(--error-color)'}; font-weight: 700; margin-bottom: 8px;">
                            ${isCorrect ? '✓ Correcto' : '✗ Incorrecto'}
                        </div>
                        <div style="font-size: 0.9rem; line-height: 1.5; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #e1dfdd;">
                            <div style="margin-bottom: 6px;">
                                <span style="color: #605e5c;">Tu respuesta:</span><br/> ${userText}
                            </div>
                            <div style="border-top: 1px dashed #c8c6c4; pt-2; margin-top: 6px; padding-top: 6px;">
                                <span style="color: var(--success-color); font-weight: 600;">Respuesta correcta:</span><br/> ${correctText}
                            </div>
                        </div>
                    </div>
                `;
            });

            const totalQ = activeQuiz.length;
            const percentage = Math.round((score / totalQ) * 100);
            const passed = percentage >= 70;

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="results-container">
                    <h2>Resultados del Simulador AZ-900</h2>
                    <div class="score-circle">${score} / ${totalQ} (${percentage}%)</div>
                    <p style="font-size: 1.1rem; font-weight: 600; color: ${passed ? 'var(--success-color)' : 'var(--error-color)'};">
                        ${passed ? '🎉 ¡APROBADO! Excelente preparación para el examen oficial.' : '📚 No alcanzaste el 70%. ¡Repasa los errores e inténtalo de nuevo!'}
                    </p>
                    <button class="btn" onclick="startQuiz()" style="margin: 15px 0;">🔄 Generar Nuevo Simulador (50 Preguntas)</button>
                    
                    <h3 style="text-align: left; margin-top: 25px; border-bottom: 1px solid #c8c6c4; padding-bottom: 5px;">Detalle de Respuestas:</h3>
                    <div class="review-list">
                        ${reviewHtml}
                    </div>
                </div>
            `;
        }

        startQuiz();
    </script>
</body>
</html>
